<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Responses - Smart Form X</title>
  <style>
    :root {
      --primary: #fafafa;
      --primary-glow: rgba(255, 255, 255, 0.1);
      --bg-dark: #09090b;
      --card-bg: #18181b;
      --border: rgba(255, 255, 255, 0.06);
      --text-muted: #a1a1aa;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: #09090b;
      
      background-image: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(120, 119, 198, 0.15), transparent);
      color: var(--primary);
      min-height: 100vh;
      padding: 40px 20px;
      overflow-x: hidden;
    }

    .main-wrapper {
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .header {
      background: var(--card-bg);
      padding: 30px 40px;
      border-radius: 24px;
      margin-bottom: 30px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }
    
    h1 { 
      background: linear-gradient(135deg, #ffffff, #a1a1aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 2.4em;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .stat-card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 20px;
      border: 1px solid var(--border);
      border-left: 4px solid var(--text-muted);
      backdrop-filter: blur(15px);
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .stat-card:active {
      transform: scale(0.97);
    }
    
    .stat-value {
      font-size: 2.5em;
      color: var(--primary);
      font-weight: 800;
      line-height: 1;
    }
    
    .stat-label {
      color: var(--text-muted);
      font-size: 0.9em;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 8px;
    }

    .filters {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 24px;
      margin-bottom: 30px;
      border: 1px solid var(--border);
      backdrop-filter: blur(15px);
    }

    .filters h3 {
      color: var(--primary);
      font-size: 1.1em;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }
    
    .filter-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }
    
    input, select {
      padding: 14px 18px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--primary);
      font-size: 0.95em;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    
    input:focus, select:focus {
      outline: none;
      border-color: var(--text-muted);
      box-shadow: 0 0 15px var(--primary-glow);
    }

    input:active, select:active {
      transform: scale(0.97);
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 25px;
      flex-wrap: wrap;
    }
    
    button {
      background: var(--primary);
      color: var(--bg-dark);
      border: none;
      padding: 14px 28px;
      font-size: 1em;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(255, 255, 255, 0.05);
    }

    button:active {
      transform: scale(0.97);
    }

    .back-btn, .btn-secondary {
      background: var(--card-bg);
      color: var(--primary);
      border: 1px solid var(--border);
    }

    .table-container {
      background: var(--card-bg);
      border-radius: 24px;
      border: 1px solid var(--border);
      backdrop-filter: blur(15px);
      overflow: hidden;
    }

    .table-responsive {
      overflow-x: auto;
      max-height: 700px;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
    }
    
    th {
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-muted);
      padding: 20px;
      text-align: left;
      font-weight: 700;
      font-size: 0.9em;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 2;
    }
    
    td {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 0.95em;
      color: var(--text-muted);
    }
    
    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
      color: var(--primary);
    }

    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 40px auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      .header { flex-direction: column; text-align: center; gap: 20px; }
      .filter-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  

  <div class="main-wrapper">
    <div class="header">
      <div>
        <h1 id="formTitle">Form Responses</h1>
        <p style="color: var(--text-muted); margin-top: 5px;">
          Monitoring activity for: <span id="adminEmail" style="color: var(--primary);"></span>
        </p>
      </div>
      <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>
    </div>

    <div class="stats" id="statsContainer"></div>

    <div class="filters">
      <h3>Search & Filtering</h3>
      <div class="filter-row">
        <input type="text" id="searchEmail" placeholder="🔍 Student Email...">
        <input type="date" id="dateFrom" title="From Date">
        <input type="date" id="dateTo" title="To Date">
        <select id="sortBy">
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
          <option value="email-asc">Email (A-Z)</option>
          <option value="email-desc">Email (Z-A)</option>
        </select>
      </div>
      <div class="button-group">
        <button onclick="applyFilters()">Apply Filters</button>
        <button onclick="resetFilters()" class="btn-secondary">Reset</button>
        <button onclick="downloadFilteredCSV()">📥 Download CSV</button>
      </div>
    </div>

    <div class="table-container">
      <div id="tableContent" class="table-responsive loading">
        <div class="spinner"></div>
        <p style="text-align: center; color: var(--text-muted);">Syncing submission data...</p>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const formId = urlParams.get('formId');
    const adminEmail = urlParams.get('adminEmail');
    
    let allSubmissions = [];
    let filteredSubmissions = [];
    let formStructure = [];

    document.getElementById('adminEmail').textContent = adminEmail;

    async function loadData() {
      try {
        const formRes = await fetch('/api/forms/get-form', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ formId })
        });
        const formData = await formRes.json();
        document.getElementById('formTitle').textContent = formData.formtitle;
        formStructure = typeof formData.formstructure === 'string' ? JSON.parse(formData.formstructure) : formData.formstructure;

        const response = await fetch('/api/submissions/get-submissions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ formId, adminEmail })
        });
        const data = await response.json();
        
        if (data.submissions && data.submissions.length > 0) {
          allSubmissions = data.submissions.map(sub => ({
            ...sub,
            responsedata: typeof sub.responsedata === 'string' ? JSON.parse(sub.responsedata) : sub.responsedata,
            submittedat: new Date(sub.submittedat)
          }));
          filteredSubmissions = [...allSubmissions];
          renderTable();
          updateStats();
        } else {
          document.getElementById('tableContent').innerHTML = '<div style="text-align:center; padding: 50px; color:var(--text-muted);">No submissions yet.</div>';
        }
      } catch (error) {
        document.getElementById('tableContent').innerHTML = '<div style="text-align:center; padding: 50px; color:#f87171;">Error loading responses.</div>';
      }
    }

    function applyFilters() {
      const searchEmail = document.getElementById('searchEmail').value.toLowerCase();
      const dateFrom = document.getElementById('dateFrom').value ? new Date(document.getElementById('dateFrom').value) : null;
      const dateTo = document.getElementById('dateTo').value ? new Date(document.getElementById('dateTo').value) : null;
      const sortBy = document.getElementById('sortBy').value;

      filteredSubmissions = allSubmissions.filter(sub => {
        if (searchEmail && !sub.studentemail.toLowerCase().includes(searchEmail)) return false;
        if (dateFrom && sub.submittedat < dateFrom) return false;
        if (dateTo && sub.submittedat > dateTo) return false;
        return true;
      });

      filteredSubmissions.sort((a, b) => {
        switch(sortBy) {
          case 'newest': return b.submittedat - a.submittedat;
          case 'oldest': return a.submittedat - b.submittedat;
          case 'email-asc': return a.studentemail.localeCompare(b.studentemail);
          case 'email-desc': return b.studentemail.localeCompare(a.studentemail);
        }
      });

      renderTable();
      updateStats();
    }

    function resetFilters() {
      document.getElementById('searchEmail').value = '';
      document.getElementById('dateFrom').value = '';
      document.getElementById('dateTo').value = '';
      document.getElementById('sortBy').value = 'newest';
      filteredSubmissions = [...allSubmissions];
      renderTable();
      updateStats();
    }

    function renderTable() {
      if (filteredSubmissions.length === 0) {
        document.getElementById('tableContent').innerHTML = '<div style="text-align:center; padding: 50px; color:var(--text-muted);">No results match your filters.</div>';
        return;
      }

      let html = '<table><thead><tr>';
      html += '<th>#</th><th>Student Email</th><th>Submitted At</th>';
      
      formStructure.forEach(q => {
        html += `<th>${q.label}</th>`;
      });
      
      html += '</tr></thead><tbody>';

      filteredSubmissions.forEach((sub, index) => {
        html += `<tr><td><strong>${index + 1}</strong></td>`;
        html += `<td><strong style="color: var(--primary);">${sub.studentemail}</strong></td>`;
        html += `<td>${sub.submittedat.toLocaleString()}</td>`;
        
        formStructure.forEach(q => {
          const answer = sub.responsedata[q.id];
          html += `<td>${Array.isArray(answer) ? answer.join(', ') : answer || '-'}</td>`;
        });
        
        html += '</tr>';
      });

      html += '</tbody></table>';
      document.getElementById('tableContent').innerHTML = html;
    }

    function updateStats() {
      const total = allSubmissions.length;
      const filtered = filteredSubmissions.length;
      const uniqueStudents = new Set(filteredSubmissions.map(s => s.studentemail)).size;

      document.getElementById('statsContainer').innerHTML = `
        <div class="stat-card">
          <div class="stat-value">${filtered}</div>
          <div class="stat-label">Matching Results</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${total}</div>
          <div class="stat-label">Total Submissions</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${uniqueStudents}</div>
          <div class="stat-label">Unique Participants</div>
        </div>
      `;
    }

    function downloadFilteredCSV() {
      if (filteredSubmissions.length === 0) {
        alert('No data to download');
        return;
      }

      let csv = 'Student Email,Submitted At,';
      csv += formStructure.map(q => q.label).join(',') + '\n';
      
      filteredSubmissions.forEach(sub => {
        csv += `"${sub.studentemail}","${sub.submittedat.toLocaleString()}",`;
        csv += formStructure.map(q => {
          const answer = sub.responsedata[q.id];
          return `"${Array.isArray(answer) ? answer.join(';') : answer || ''}"`;
        }).join(',') + '\n';
      });
      
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `responses_${formId}_${Date.now()}.csv`;
      a.click();
      window.URL.revokeObjectURL(url);
    }

    function goBack() {
      window.location.href = `/admin.html?email=${adminEmail}`;
    }

    loadData();
  </script>
</body>
</html>
