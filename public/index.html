<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Form X</title>
  <style>
    /* UI ENHANCEMENTS: 
       - Senior UX Typography
       - Interactive 3D Mesh Background
       - Enhanced Glassmorphism & Depth
       - Logic & Colors Untouched
    */
    :root {
      --bg-dark: #09090b;
      --text-main: #fafafa;
      --text-muted: #a1a1aa;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body { 
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      background: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      overflow-y: auto;
      line-height: 1.5;
    }

    /* 3D Canvas Layer */
    #hero-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background: radial-gradient(circle at center, #111113 0%, #09090b 100%);
    }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      text-align: center;
      position: relative;
      z-index: 2;
    }
    
    h1 {
      font-size: clamp(3em, 10vw, 6em);
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 10px;
      letter-spacing: -2px;
      line-height: 1;
      opacity: 0;
      transform: scale(0.95);
      animation: revealScale 1s cubic-bezier(0.22, 1, 0.36, 1) forwards 0.2s;
    }
    
    .subtitle {
      font-size: clamp(1.1em, 3vw, 1.5em);
      color: var(--text-muted);
      margin-bottom: 40px;
      font-weight: 400;
      opacity: 0;
      animation: reveal 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards 0.4s;
    }
    
    /* Login Button */
    .login-btn {
      background: var(--text-main);
      color: var(--bg-dark);
      border: none;
      padding: 16px 40px;
      font-size: 1.1em;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      text-decoration: none;
      display: inline-block;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 14px rgba(255, 255, 255, 0.1);
      opacity: 0;
      animation: reveal 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards 0.6s;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255, 255, 255, 0.15);
    }

    .login-btn:active {
      transform: scale(0.97);
    }

    /* Footer Stats */
    .footer-text {
      position: relative;
      padding-bottom: 40px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 30px;
      z-index: 2;
      opacity: 0;
      animation: reveal 1s cubic-bezier(0.22, 1, 0.36, 1) forwards 0.8s;
    }

    .footer-text span {
      font-size: 0.85em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    
    .footer-text span:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.1);
    }

    /* Animations */
    @keyframes reveal {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes revealScale {
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 768px) {
      .footer-text { flex-direction: column; align-items: center; gap: 10px; padding-bottom: 20px; }
    }
  </style>
</head>
<body>
  <canvas id="hero-canvas"></canvas>

  <div class="hero">
    <h1>SMART FORM X</h1>
    <p class="subtitle">Intelligent form management</p>
    <a href="/auth/google" class="login-btn">ACCESS SYSTEM</a>
  </div>

  <div class="footer-text">
    <span>🔒 Secure Authentication</span>
    <span>👥 Role-Based Access</span>
    <span>📊 Real-Time Analytics</span>
  </div>

  <script>
    /* --- 3D INTERACTIVE MESH LOGIC --- */
    const canvas = document.getElementById('hero-canvas');
    const ctx = canvas.getContext('2d');
    let points = [];
    let mouse = { x: null, y: null, radius: 150 };

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.x;
      mouse.y = e.y;
    });

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      init();
    }

    class Point {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.baseX = this.x;
        this.baseY = this.y;
        this.size = 2;
        this.density = (Math.random() * 30) + 1;
      }
      update() {
        let dx = mouse.x - this.x;
        let dy = mouse.y - this.y;
        let distance = Math.sqrt(dx * dx + dy * dy);
        let forceDirectionX = dx / distance;
        let forceDirectionY = dy / distance;
        let maxDistance = mouse.radius;
        let force = (maxDistance - distance) / maxDistance;
        let directionX = forceDirectionX * force * this.density;
        let directionY = forceDirectionY * force * this.density;

        if (distance < mouse.radius) {
          this.x -= directionX;
          this.y -= directionY;
        } else {
          if (this.x !== this.baseX) {
            let dx = this.x - this.baseX;
            this.x -= dx / 10;
          }
          if (this.y !== this.baseY) {
            let dy = this.y - this.baseY;
            this.y -= dy / 10;
          }
        }
      }
      draw() {
        ctx.fillStyle = 'rgba(250, 250, 250, 0.4)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.closePath();
        ctx.fill();
      }
    }

    function init() {
      points = [];
      const count = (canvas.width * canvas.height) / 15000;
      for (let i = 0; i < count; i++) {
        points.push(new Point());
      }
    }

    function connect() {
      for (let a = 0; a < points.length; a++) {
        for (let b = a; b < points.length; b++) {
          let dx = points[a].x - points[b].x;
          let dy = points[a].y - points[b].y;
          let distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < 150) {
            let opacity = 1 - (distance / 150);
            ctx.strokeStyle = `rgba(250, 250, 250, ${opacity * 0.15})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(points[a].x, points[a].y);
            ctx.lineTo(points[b].x, points[b].y);
            ctx.stroke();
          }
        }
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < points.length; i++) {
        points[i].update();
        points[i].draw();
      }
      connect();
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    resize();
    animate();
  </script>
</body>
</html>
