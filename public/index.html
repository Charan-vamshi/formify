<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Form X</title>
  <style>
    /* UI ENHANCEMENTS: 
       - Senior UX Typography
       - Interactive 3D Mesh Background
       - Enhanced Glassmorphism & Depth
       - Logic & Colors Untouched
    */
    :root {
      --bg-dark: #09090b;
      --text-main: #fafafa;
      --text-muted: #a1a1aa;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body { 
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      background: #09090b;
      
      background-image: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(120, 119, 198, 0.15), transparent);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      overflow-y: auto;
      line-height: 1.5;
    }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      text-align: center;
      position: relative;
      z-index: 2;
    }
    
    h1 {
      font-size: clamp(3em, 10vw, 6em);
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 10px;
      letter-spacing: -2px;
      line-height: 1;
      opacity: 0;
      transform: scale(0.95);
      animation: revealScale 1s cubic-bezier(0.22, 1, 0.36, 1) forwards 0.2s;
    }
    
    .subtitle {
      font-size: clamp(1.1em, 3vw, 1.5em);
      color: var(--text-muted);
      margin-bottom: 40px;
      font-weight: 400;
      opacity: 0;
      animation: reveal 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards 0.4s;
    }
    
    /* Login Button */
    .login-btn {
      background: var(--text-main);
      color: var(--bg-dark);
      border: none;
      padding: 16px 40px;
      font-size: 1.1em;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      text-decoration: none;
      display: inline-block;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 14px rgba(255, 255, 255, 0.1);
      opacity: 0;
      animation: reveal 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards 0.6s;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255, 255, 255, 0.15);
    }

    .login-btn:active {
      transform: scale(0.97);
    }

    /* Footer Stats */
    .footer-text {
      position: relative;
      padding-bottom: 40px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 30px;
      z-index: 2;
      opacity: 0;
      animation: reveal 1s cubic-bezier(0.22, 1, 0.36, 1) forwards 0.8s;
    }

    .footer-text span {
      font-size: 0.85em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    
    .footer-text span:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.1);
    }

    /* Animations */
    @keyframes reveal {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes revealScale {
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 768px) {
      .footer-text { flex-direction: column; align-items: center; gap: 10px; padding-bottom: 20px; }
    }
  </style>
</head>
<body>
  

  <div class="hero">
    <h1>SMART FORM X</h1>
    <p class="subtitle">Intelligent form management</p>
    <a href="/auth/google" class="login-btn">ACCESS SYSTEM</a>
  </div>

  <div class="footer-text">
    <span>🔒 Secure Authentication</span>
    <span>👥 Role-Based Access</span>
    <span>📊 Real-Time Analytics</span>
  </div>

  <script>
    </script>
</body>
</html>
